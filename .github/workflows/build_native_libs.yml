name: Build Native Libs (PQC)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'native/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Linux x86_64 + aarch64 ─────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Install cross-compilers
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Linux x86_64
        working-directory: native
        env:
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -o ../linux/shared/x86_64/libopenpgp_bridge.so .

      - name: Build Linux aarch64
        working-directory: native
        env:
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
          GOOS: linux
          GOARCH: arm64
        run: go build -buildmode=c-shared -o ../linux/shared/aarch64/libopenpgp_bridge.so .

      - name: Verify PQC symbols
        run: |
          for f in linux/shared/x86_64/libopenpgp_bridge.so linux/shared/aarch64/libopenpgp_bridge.so; do
            if grep -qa "circl/sign/mldsa" "$f"; then
              echo "✅ PQC confirmed: $f"
            else
              echo "❌ No PQC symbols: $f" && exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-libs
          path: linux/shared/

  # ── macOS universal dylib ──────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Build macOS arm64
        working-directory: native
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
        run: go build -buildmode=c-shared -o /tmp/libopenpgp_bridge_arm64.dylib .

      - name: Build macOS x86_64
        working-directory: native
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64
        run: go build -buildmode=c-shared -o /tmp/libopenpgp_bridge_amd64.dylib .

      - name: Lipo universal dylib
        run: |
          lipo -create \
            /tmp/libopenpgp_bridge_arm64.dylib \
            /tmp/libopenpgp_bridge_amd64.dylib \
            -output /tmp/libopenpgp_bridge.dylib
          # Fix install name so CocoaPods links it as @rpath/... not /tmp/...
          install_name_tool -id @rpath/libopenpgp_bridge.dylib /tmp/libopenpgp_bridge.dylib

      - name: Verify PQC symbols
        run: |
          if grep -qa "circl/sign/mldsa" /tmp/libopenpgp_bridge.dylib; then
            echo "✅ PQC confirmed in macOS dylib"
          else
            echo "❌ No PQC symbols in macOS dylib" && exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dylib
          path: /tmp/libopenpgp_bridge.dylib

      # Wrap the freshly built dylib into the xcframework Swift Package Manager
      # embeds (macos/openpgp/OpenPGPBridge.xcframework). Committed alongside the
      # dylib so hosted SPM consumers can resolve the macOS package.
      - name: Build SPM xcframework from dylib
        run: |
          cp /tmp/libopenpgp_bridge.dylib macos/libopenpgp_bridge.dylib
          ./scripts/build_macos_xcframework.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-spm-xcframework
          path: macos/openpgp/OpenPGPBridge.xcframework/

  # ── Android (all 4 ABIs) ───────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Locate NDK prebuilt toolchain
        id: ndk
        run: |
          NDK_BIN=$(ls -d "$ANDROID_HOME/ndk/"*/toolchains/llvm/prebuilt/linux-x86_64/bin 2>/dev/null | sort -V | tail -1)
          echo "bin=$NDK_BIN" >> "$GITHUB_OUTPUT"

      - name: Build Android arm64-v8a
        working-directory: native
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm64
          CC: ${{ steps.ndk.outputs.bin }}/aarch64-linux-android21-clang
        run: go build -buildmode=c-shared -o ../android/src/main/jniLibs/arm64-v8a/libopenpgp_bridge.so .

      - name: Build Android armeabi-v7a
        working-directory: native
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm
          GOARM: "7"
          CC: ${{ steps.ndk.outputs.bin }}/armv7a-linux-androideabi21-clang
        run: go build -buildmode=c-shared -o ../android/src/main/jniLibs/armeabi-v7a/libopenpgp_bridge.so .

      - name: Build Android x86_64
        working-directory: native
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: amd64
          CC: ${{ steps.ndk.outputs.bin }}/x86_64-linux-android21-clang
        run: go build -buildmode=c-shared -o ../android/src/main/jniLibs/x86_64/libopenpgp_bridge.so .

      - name: Build Android x86
        working-directory: native
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: "386"
          CC: ${{ steps.ndk.outputs.bin }}/i686-linux-android21-clang
        run: go build -buildmode=c-shared -o ../android/src/main/jniLibs/x86/libopenpgp_bridge.so .

      - name: Verify PQC symbols
        run: |
          for f in android/src/main/jniLibs/*/libopenpgp_bridge.so; do
            if grep -qa "circl/sign/mldsa" "$f"; then
              echo "✅ PQC confirmed: $f"
            else
              echo "❌ No PQC symbols: $f" && exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: android/src/main/jniLibs/

  # ── iOS xcframework ────────────────────────────────────────────────────────
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Build iOS static archives
        working-directory: native
        run: |
          IOS_CC=$(xcrun -sdk iphoneos -find clang)
          IOS_SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          SIM_CC=$(xcrun -sdk iphonesimulator -find clang)
          SIM_SDK=$(xcrun -sdk iphonesimulator --show-sdk-path)
          MAC_CC=$(xcrun -sdk macosx -find clang)
          MAC_SDK=$(xcrun -sdk macosx --show-sdk-path)

          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$IOS_CC" \
            CGO_CFLAGS="-target arm64-apple-ios12.0 -isysroot $IOS_SDK" \
            CGO_LDFLAGS="-target arm64-apple-ios12.0 -isysroot $IOS_SDK" \
            go build -buildmode=c-archive -o /tmp/ios_device_arm64.a .

          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$SIM_CC" \
            CGO_CFLAGS="-target arm64-apple-ios12.0-simulator -isysroot $SIM_SDK" \
            CGO_LDFLAGS="-target arm64-apple-ios12.0-simulator -isysroot $SIM_SDK" \
            go build -buildmode=c-archive -o /tmp/ios_sim_arm64.a .

          CGO_ENABLED=1 GOOS=ios GOARCH=amd64 \
            CC="$SIM_CC" \
            CGO_CFLAGS="-target x86_64-apple-ios12.0-simulator -isysroot $SIM_SDK" \
            CGO_LDFLAGS="-target x86_64-apple-ios12.0-simulator -isysroot $SIM_SDK" \
            go build -buildmode=c-archive -o /tmp/ios_sim_amd64.a .

          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$MAC_CC" \
            CGO_CFLAGS="-target arm64-apple-ios13.1-macabi -isysroot $MAC_SDK" \
            CGO_LDFLAGS="-target arm64-apple-ios13.1-macabi -isysroot $MAC_SDK" \
            go build -buildmode=c-archive -o /tmp/ios_catalyst_arm64.a .

          CGO_ENABLED=1 GOOS=ios GOARCH=amd64 \
            CC="$MAC_CC" \
            CGO_CFLAGS="-target x86_64-apple-ios13.1-macabi -isysroot $MAC_SDK" \
            CGO_LDFLAGS="-target x86_64-apple-ios13.1-macabi -isysroot $MAC_SDK" \
            go build -buildmode=c-archive -o /tmp/ios_catalyst_amd64.a .

          lipo -create /tmp/ios_sim_arm64.a /tmp/ios_sim_amd64.a \
            -output /tmp/ios_sim_universal.a
          lipo -create /tmp/ios_catalyst_arm64.a /tmp/ios_catalyst_amd64.a \
            -output /tmp/ios_catalyst_universal.a

      # The .framework binary is just the .a archive renamed — copy directly
      # into the existing xcframework slots so the podspec paths stay intact.
      - name: Install archives into xcframework slots
        run: |
          cp /tmp/ios_device_arm64.a \
            ios/openpgp/OpenPGPBridge.xcframework/ios-arm64/OpenPGPBridge.framework/OpenPGPBridge
          cp /tmp/ios_sim_universal.a \
            ios/openpgp/OpenPGPBridge.xcframework/ios-arm64_x86_64-simulator/OpenPGPBridge.framework/OpenPGPBridge
          cp /tmp/ios_catalyst_universal.a \
            ios/openpgp/OpenPGPBridge.xcframework/ios-arm64_x86_64-maccatalyst/OpenPGPBridge.framework/OpenPGPBridge

      - name: Verify PQC symbols
        run: |
          for slice in \
            ios/openpgp/OpenPGPBridge.xcframework/ios-arm64/OpenPGPBridge.framework/OpenPGPBridge \
            ios/openpgp/OpenPGPBridge.xcframework/ios-arm64_x86_64-simulator/OpenPGPBridge.framework/OpenPGPBridge \
            ios/openpgp/OpenPGPBridge.xcframework/ios-arm64_x86_64-maccatalyst/OpenPGPBridge.framework/OpenPGPBridge; do
            if grep -qa "circl/sign/mldsa" "$slice"; then
              echo "✅ PQC confirmed: $slice"
            else
              echo "❌ No PQC symbols: $slice" && exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: ios/openpgp/OpenPGPBridge.xcframework/

  # ── WASM ───────────────────────────────────────────────────────────────────
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Build WASM
        working-directory: native
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: "0"
        run: go build -o /tmp/openpgp.wasm .

      - name: Verify PQC symbols
        run: |
          if grep -qaP "ML-DSA-65\+Ed25519" /tmp/openpgp.wasm; then
            echo "✅ PQC confirmed in openpgp.wasm"
          else
            echo "❌ No PQC symbols in openpgp.wasm" && exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-binary
          path: /tmp/openpgp.wasm

  # ── Windows DLL ─────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Install MinGW (CGO C compiler)
        run: choco install mingw --no-progress -y
        shell: pwsh

      - name: Build libopenpgp_bridge.dll
        working-directory: native
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go build -buildmode=c-shared -o ../windows/shared/libopenpgp_bridge.dll .

      - name: Verify PQC symbols
        shell: pwsh
        run: |
          $dll = [System.IO.File]::ReadAllBytes("windows\shared\libopenpgp_bridge.dll")
          $text = [System.Text.Encoding]::ASCII.GetString($dll)
          if ($text -notmatch 'ML-DSA-65\+Ed25519|circl/sign/mldsa') {
            Write-Error "ERROR: PQC symbols not found in DLL"
            exit 1
          }
          Write-Host "PQC symbols confirmed in DLL."

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dll
          path: |
            windows/shared/libopenpgp_bridge.dll
            windows/shared/libopenpgp_bridge.h

  # ── Single commit job (no push race) ───────────────────────────────────────
  commit:
    needs: [linux, macos, android, ios, wasm, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-libs
          path: linux/shared/

      - uses: actions/download-artifact@v4
        with:
          name: macos-dylib
          path: macos/

      - uses: actions/download-artifact@v4
        with:
          name: macos-spm-xcframework
          path: macos/openpgp/OpenPGPBridge.xcframework/

      - uses: actions/download-artifact@v4
        with:
          name: android-libs
          path: android/src/main/jniLibs/

      - uses: actions/download-artifact@v4
        with:
          name: ios-xcframework
          path: ios/openpgp/OpenPGPBridge.xcframework/

      - uses: actions/download-artifact@v4
        with:
          name: wasm-binary
          path: lib/web/assets/

      - uses: actions/download-artifact@v4
        with:
          name: windows-dll
          path: windows/shared/

      - name: Rename downloaded WASM to correct filename
        run: mv lib/web/assets/openpgp.wasm lib/web/assets/openpgp.wasm 2>/dev/null || true

      - name: Commit all rebuilt binaries
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            linux/shared/ \
            macos/libopenpgp_bridge.dylib \
            macos/openpgp/OpenPGPBridge.xcframework/ \
            android/src/main/jniLibs/ \
            ios/openpgp/OpenPGPBridge.xcframework/ \
            lib/web/assets/openpgp.wasm \
            windows/shared/libopenpgp_bridge.dll \
            windows/shared/libopenpgp_bridge.h
          if git diff --cached --quiet; then
            echo "All binaries unchanged — nothing to commit."
          else
            git commit -m "chore: rebuild all native libs with PQC support (MLDSA/MLKEM)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && break
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            done
          fi
