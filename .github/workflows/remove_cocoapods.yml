name: Remove CocoaPods (one-shot)

# One-shot maintenance job: the plugin is Swift Package Manager only, but the
# example iOS/macOS projects still carried CocoaPods integration left over from
# before the SPM migration. This runs `pod deintegrate` on a macOS runner (the
# maintainer has no Mac) and commits the cleaned, SPM-only projects back to the
# branch. Safe to delete once it has run successfully.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deintegrate:
    runs-on: macos-14
    permissions:
      contents: write
    # Checked out into "openpgp" so Flutter's SPM package identity (derived from
    # the Dart package root basename) matches the plugin name during the macOS
    # config step below.
    defaults:
      run:
        working-directory: openpgp
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          path: openpgp
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Configure Flutter
        run: |
          flutter config --enable-macos-desktop
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: macOS — preserve embed phase, then remove CocoaPods
        run: |
          set -euo pipefail
          # SPM links the bridge xcframework but does not embed its bare dylib, so
          # the macOS app relies on the Podfile post_install's
          # "[Custom] Embed libopenpgp_bridge.dylib" build phase. We must bake that
          # phase into the committed project before deleting the Podfile.
          #
          # `flutter build macos --config-only` runs `pod install` (which injects
          # the phase) but, with SPM enabled, it also writes Flutter's ephemeral
          # SwiftPM project references that must NOT be committed. So we reset the
          # project file and re-run *raw* `pod install`, which adds only the
          # post_install phase (no SPM refs).
          (cd example && flutter build macos --config-only)
          git checkout -- example/macos/Runner.xcodeproj/project.pbxproj
          (cd example/macos && pod install)
          grep -q 'Embed libopenpgp_bridge.dylib' example/macos/Runner.xcodeproj/project.pbxproj \
            || { echo '::error::macOS [Custom] embed phase was not injected'; exit 1; }

          (cd example/macos && pod deintegrate)
          grep -q 'Embed libopenpgp_bridge.dylib' example/macos/Runner.xcodeproj/project.pbxproj \
            || { echo '::error::macOS [Custom] embed phase lost during deintegrate'; exit 1; }
          if grep -qE 'Pods_Runner|\[CP\]' example/macos/Runner.xcodeproj/project.pbxproj; then
            echo '::error::macOS project still has CocoaPods integration'; exit 1
          fi

      - name: iOS — remove CocoaPods
        run: |
          set -euo pipefail
          # iOS links the static bridge xcframework via SPM and needs no embed
          # phase, so a plain deintegrate is enough.
          (cd example/ios && pod deintegrate)
          if grep -qE 'Pods_Runner|\[CP\]' example/ios/Runner.xcodeproj/project.pbxproj; then
            echo '::error::iOS project still has CocoaPods integration'; exit 1
          fi

      - name: Delete Podfiles and commit
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            example/ios/Podfile example/ios/Podfile.lock \
            example/macos/Podfile example/macos/Podfile.lock
          # Only stage the surgical deintegration changes; leave Flutter build
          # artifacts (GeneratedPluginRegistrant, ephemeral) untouched.
          git add example/ios/Runner.xcodeproj/project.pbxproj \
                  example/macos/Runner.xcodeproj/project.pbxproj \
                  example/ios/Runner.xcworkspace/contents.xcworkspacedata \
                  example/macos/Runner.xcworkspace/contents.xcworkspacedata
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No changes to commit'; exit 0
          fi
          git status
          git commit \
            -m "chore(example): remove CocoaPods integration (SPM-only)" \
            -m "Run pod deintegrate on the iOS and macOS example projects so they no longer carry CocoaPods integration left over from before the SPM migration. The macOS [Custom] Embed libopenpgp_bridge.dylib build phase is preserved (deintegrate strips only [CP] phases), since SPM links but does not embed the bare dylib from the xcframework. Generated by the remove_cocoapods workflow." \
            -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push
