name: Integration Tests Android

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@main
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          disable-animations: true
          script: |
            cd example && flutter test integration_test/app_test.dart > /tmp/flutter_out.txt 2>&1 || true
            cat /tmp/flutter_out.txt
            grep -qE 'Some tests failed|❌' /tmp/flutter_out.txt && echo 'Integration tests failed' && exit 1 || true
            grep -qE 'tests passed|🎉' /tmp/flutter_out.txt || { echo 'No tests ran successfully'; exit 1; }
            echo 'All integration tests passed'
