name: Integration Tests iOS

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: macos-14
    steps:
      - uses: futureware-tech/simulator-action@v1
        id: sim
        with:
          model: 'iPhone 16'
          os: iOS
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: install deps (CocoaPods)
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd example/ios && pod install
      - name: Run integration tests
        timeout-minutes: 30
        run: |
          cd example
          # Pin to the exact simulator that simulator-action booted; the runner can
          # host more than one "iPhone 16" and a name match may target an unbooted
          # device and hang. Stream output via tee so a hang is visible live.
          flutter test -d "${{ steps.sim.outputs.udid }}" integration_test/app_test.dart 2>&1 | tee /tmp/flutter_out.txt || true
          if grep -qE 'Some tests failed|❌' /tmp/flutter_out.txt; then
            echo 'Integration tests failed'; exit 1
          fi
          if ! grep -qE 'tests passed|🎉' /tmp/flutter_out.txt; then
            echo 'No tests ran successfully'; exit 1
          fi
          echo 'All integration tests passed'

  # Validate that the plugin resolves, compiles, links and embeds through Swift
  # Package Manager by building the example app for the simulator. This is the
  # meaningful SPM guarantee for a plugin (and would catch the binaryTarget-path
  # and package-identity issues we hit). Full runtime behaviour is exercised by
  # the macOS SPM job (same Dart/FFI bridge) and the iOS CocoaPods job (same app);
  # integration_test is intentionally not run here because Flutter's experimental
  # SPM integration cannot discover the Dart VM service on the iOS simulator (the
  # app builds, links and launches, but `flutter test` hangs at "Waiting for VM
  # Service port"), which is a test-harness limitation unrelated to the plugin.
  #
  # Checked out into a directory named after the plugin ("openpgp"): Flutter's SPM
  # integration derives the plugin's SwiftPM package identity from the Dart package
  # root's directory basename, which must equal the plugin name (the repo itself is
  # "flutter-openpgp"). Published (hosted) consumers are unaffected.
  spm-build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: openpgp
    steps:
      - uses: actions/checkout@v4
        with:
          path: openpgp
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: Build example via Swift Package Manager
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          cd example
          # Compiles and links the SPM-resolved plugin (incl. the OpenPGPBridge
          # binaryTarget) for the simulator; no code signing required.
          flutter build ios --debug --simulator --no-codesign 2>&1 | tee /tmp/flutter_out.txt
          grep -q 'Xcode build done' /tmp/flutter_out.txt || { echo 'SPM build failed'; exit 1; }
          echo 'SPM iOS build/link succeeded'
