name: Integration Tests iOS

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: macos-14
    steps:
      - uses: futureware-tech/simulator-action@v1
        with:
          model: 'iPhone 16'
          os: iOS
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: install deps (CocoaPods)
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd example/ios && pod install
      - name: Run integration tests
        timeout-minutes: 30
        run: |
          cd example
          output=$(flutter test -d "iPhone 16" integration_test/app_test.dart 2>&1) || true
          echo "$output"
          if echo "$output" | grep -qE 'Some tests failed|❌'; then
            echo 'Integration tests failed'; exit 1
          fi
          if ! echo "$output" | grep -qE 'tests passed|🎉'; then
            echo 'No tests ran successfully'; exit 1
          fi
          echo 'All integration tests passed'

  # Same integration tests, but resolving the native bridge through Swift Package
  # Manager instead of CocoaPods. The iOS bridge xcframework is already in the repo.
  e2e-spm:
    runs-on: macos-14
    steps:
      - uses: futureware-tech/simulator-action@v1
        with:
          model: 'iPhone 16'
          os: iOS
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: install deps (Swift Package Manager)
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Run integration tests
        timeout-minutes: 30
        run: |
          cd example
          output=$(flutter test -d "iPhone 16" integration_test/app_test.dart 2>&1) || true
          echo "$output"
          if echo "$output" | grep -qE 'Some tests failed|❌'; then
            echo 'Integration tests failed'; exit 1
          fi
          if ! echo "$output" | grep -qE 'tests passed|🎉'; then
            echo 'No tests ran successfully'; exit 1
          fi
          echo 'All integration tests passed'
