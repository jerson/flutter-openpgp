name: Integration Tests iOS

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  e2e:
    runs-on: macos-latest
    steps:
      - uses: futureware-tech/simulator-action@v1
        with:
          os: iOS
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@main
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: install deps
        run: |
          flutter pub get
          cd example/ios && pod install
      - name: Run integration tests
        run: |
          cd example
          output=$(flutter test integration_test/app_test.dart 2>&1) || true
          echo "$output"
          if echo "$output" | grep -qE 'Some tests failed|❌'; then
            echo 'Integration tests failed'; exit 1
          fi
          if ! echo "$output" | grep -qE 'tests passed|🎉'; then
            echo 'No tests ran successfully'; exit 1
          fi
          echo 'All integration tests passed'
