name: Integration Tests iOS

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The plugin is Swift Package Manager only. The repo is checked out into a
  # directory named after the plugin ("openpgp") because Flutter's SPM integration
  # derives the plugin's SwiftPM package identity from the Dart package root's
  # directory basename, which must equal the plugin name (the repo is
  # "flutter-openpgp"). Hosted (pub.dev) consumers are unaffected.
  e2e:
    runs-on: macos-14
    defaults:
      run:
        working-directory: openpgp
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          path: openpgp
      # The runner ships several iOS runtimes, so "iPhone 16" alone matches more
      # than one device and simulator-action just warns and picks an arbitrary one.
      # Resolve the newest installed iOS runtime and take its iPhone (preferring
      # iPhone 16) so we deterministically test on the latest available iOS.
      - name: Select latest iOS simulator
        id: simselect
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("SimRuntime.iOS-[0-9]")))
            | sort_by(.key | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)") | [(.a|tonumber), (.b|tonumber)])
            | last.value
            | (map(select(.name == "iPhone 16")) + map(select(.name | test("iPhone"))))
            | .[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "No available iOS iPhone simulator found:"; xcrun simctl list devices available; exit 1
          fi
          echo "Selected simulator:"; xcrun simctl list devices available | grep -i "$udid" || true
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - uses: futureware-tech/simulator-action@v5
        with:
          udid: ${{ steps.simselect.outputs.udid }}
          # Block until the simulator is fully booted so the flutter attach below
          # does not race a half-booted device (a known trigger for the VM Service
          # hang, flutter/flutter#160930).
          wait_for_boot: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: install deps
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Run integration tests
        run: |
          cd example
          # Stream output via tee so progress is visible live and a hang is not a
          # blind timeout; grep the captured copy to decide pass/fail. Same shape as
          # the Linux/macOS workflows now that the iOS retry wrapper is gone.
          flutter test -d "${{ steps.simselect.outputs.udid }}" integration_test/app_test.dart 2>&1 | tee /tmp/flutter_out.txt || true
          if grep -qE 'Some tests failed|❌' /tmp/flutter_out.txt; then
            echo 'Integration tests failed'; exit 1
          fi
          if ! grep -qE 'tests passed|🎉' /tmp/flutter_out.txt; then
            echo 'No tests ran successfully'; exit 1
          fi
          echo 'All integration tests passed'
