name: Integration Tests Linux

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@main
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: sudo apt-get update && sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev
      - name: install deps
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
      - name: Run integration tests
        run: |
          cd example
          output=$(xvfb-run flutter test -d linux integration_test/app_test.dart 2>&1) || true
          echo "$output"
          if echo "$output" | grep -qE 'Some tests failed|❌'; then
            echo 'Integration tests failed'; exit 1
          fi
          if ! echo "$output" | grep -qE 'tests passed|🎉'; then
            echo 'No tests ran successfully'; exit 1
          fi
          echo 'All integration tests passed'
      - run: "cd example && flutter test test/app_test.dart"
