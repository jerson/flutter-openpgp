name: Integration Tests Linux

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@main
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: sudo apt-get update && sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev
      - name: install deps
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
      - name: Run integration tests
        run: |
          cd example
          # Stream output via tee so progress is visible live and a hang is not a
          # blind timeout; grep the captured copy to decide pass/fail.
          xvfb-run flutter test -d linux integration_test/app_test.dart 2>&1 | tee /tmp/flutter_out.txt || true
          if grep -qE 'Some tests failed|❌' /tmp/flutter_out.txt; then
            echo 'Integration tests failed'; exit 1
          fi
          if ! grep -qE 'tests passed|🎉' /tmp/flutter_out.txt; then
            echo 'No tests ran successfully'; exit 1
          fi
          echo 'All integration tests passed'
      - run: "cd example && flutter test test/app_test.dart"
