name: Integration Tests macOS

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Swift Package Manager only. Checked out into a directory named after the plugin
  # ("openpgp") so Flutter's SPM package identity (derived from the Dart package
  # root basename) matches the plugin name. Uses the committed
  # macos/openpgp/OpenPGPBridge.xcframework (built from the dylib by
  # build_native_libs), i.e. exactly what hosted consumers resolve.
  e2e:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: openpgp
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          path: openpgp
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: install deps
        run: |
          flutter config --enable-macos-desktop
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Run integration tests
        run: |
          cd example
          # Stream output via tee so progress is visible live and a hang is not a
          # blind timeout; grep the captured copy to decide pass/fail.
          flutter test -d macos integration_test/app_test.dart 2>&1 | tee /tmp/flutter_out.txt || true
          if grep -qE 'Some tests failed|❌' /tmp/flutter_out.txt; then
            echo 'Integration tests failed'; exit 1
          fi
          if ! grep -qE 'tests passed|🎉' /tmp/flutter_out.txt; then
            echo 'No tests ran successfully'; exit 1
          fi
          echo 'All integration tests passed'
      - run: "cd example && flutter test test/app_test.dart"
