name: Integration Tests Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: install deps
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
      - name: Run integration tests
        run: |
          cd example
          # Stream output via Tee-Object so progress is visible live and a hang is
          # not a blind timeout; read the captured copy to decide pass/fail.
          flutter test -d windows integration_test/app_test.dart 2>&1 | Tee-Object -FilePath flutter_out.txt
          $output = Get-Content flutter_out.txt -Raw
          if ($output -match '❌') { Write-Host 'Integration tests failed'; exit 1 }
          if ($output -notmatch '🎉|tests passed') { Write-Host 'No tests ran successfully'; exit 1 }
          Write-Host 'All integration tests passed'
          exit 0
      - run: "cd example && flutter test test/app_test.dart"
