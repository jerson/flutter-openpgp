name: Integration Tests Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@main
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: install deps
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
      - name: Run integration tests
        run: |
          cd example
          $output = (flutter test -d windows integration_test/app_test.dart 2>&1) | Out-String
          Write-Host $output
          if ($output -match '❌') { Write-Host 'Integration tests failed'; exit 1 }
          if ($output -notmatch '🎉|tests passed') { Write-Host 'No tests ran successfully'; exit 1 }
          Write-Host 'All integration tests passed'
          exit 0
      - run: "cd example && flutter test test/app_test.dart"
