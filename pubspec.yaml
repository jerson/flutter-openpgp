name: openpgp
description: OpenPGP library for Android, iOS, macOS, Linux, Windows, and Web with post-quantum cryptography (ML-DSA / ML-KEM).
version: 3.12.3
homepage: https://github.com/jerson/flutter-openpgp

environment:
  # Swift Package Manager support requires Flutter 3.41.0+ (and the Dart SDK it
  # ships). CocoaPods builds continue to work on older Flutter when SPM is off.
  sdk: ^3.11.0
  flutter: ">=3.41.0"

false_secrets:
 - /example/lib/*.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ffi: ^2.1.3
  flat_buffers: ^25.9.23
  path: ^1.9.0
  web: ">=0.5.0 <2.0.0"
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.jerson.openpgp
        pluginClass: OpenpgpPlugin
      ios:
        pluginClass: OpenpgpPlugin
      web:
        pluginClass: OpenpgpPlugin
        fileName: web/openpgp_web.dart
      linux:
        pluginClass: OpenpgpPlugin
      macos:
        pluginClass: OpenpgpPlugin
      windows:
        pluginClass: OpenpgpPlugin
